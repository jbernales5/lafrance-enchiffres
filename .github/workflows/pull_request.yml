name: Vérifications

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verifier:
    name: Contrat de données, types et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installer les dépendances
        run: npm ci
        env:
          HUSKY: 0
      - name: Vérifications
        run: npm run check

      - name: Build
        run: npm run build
